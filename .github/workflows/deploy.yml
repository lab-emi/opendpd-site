name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      studio_ref:
        description: 'OpenDPD commit or tag to publish under /studio/'
        required: false
        type: string

# 必须加上这些权限，否则 403 报错
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout the reviewed Studio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lab-emi/OpenDPD
          ref: ${{ inputs.studio_ref || vars.STUDIO_REF || '69537fba1a6d72ff684eb815d291a1db3c16bac9' }}
          path: .studio-source

      - name: Build the public Studio
        working-directory: .studio-source/frontend
        env:
          VITE_STUDIO_MODE: web
          VITE_API_ORIGIN: https://api.opendpd.com
          VITE_BASE_PATH: ./
        run: npm ci && npm run build

      - name: Include Studio without replacing the landing page
        run: |
          mkdir -p dist/studio
          cp -a .studio-source/frontend/dist/. dist/studio/
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
